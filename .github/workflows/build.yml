name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create app structure
        run: |
          python3 .github/scripts/build.py
          echo "--- Files created ---"
          ls -la
          ls -la android 2>/dev/null || ls -la app 2>/dev/null || true

      - name: Build APK with Gradle
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f android/gradlew ]; then
            cd android
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
            cd ..
          else
            echo "gradlew not found - checking build.py output"
            find . -name "build.gradle" -o -name "gradlew" | head -20
          fi
          echo "--- Searching APK ---"
          find . -name "*.apk" -type f

      - name: Upload APK
       
